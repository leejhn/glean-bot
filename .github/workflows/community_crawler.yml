name: Hourly Community Mission Crawler

on:
  schedule:
    - cron: '0 * * * *'  # 매 1시간마다 실행
  workflow_dispatch:      # 수동 실행 지원

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python community_crawler.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add curated_missions.json
          [ -f naver_pay_extension_html/curated_missions.json ] && git add naver_pay_extension_html/curated_missions.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: hourly curated missions update [skip ci]" && git push)

